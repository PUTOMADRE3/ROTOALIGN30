
name: Build ROTOALIGN 30 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q ROTOALIGN30_Android_Inicial.zip

      - name: Build APK
        run: gradle -p ROTOALIGN30_Android assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ROTOALIGN30-APK
          path: ROTOALIGN30_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
